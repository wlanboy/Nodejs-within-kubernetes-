{{- if .Values.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "nodejs-hello-world.fullname" . }}
  labels:
    {{- include "nodejs-hello-world.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.istio.host | quote }}
  gateways:
    - {{ include "nodejs-hello-world.fullname" . }}
  http:
    - route:
        - destination:
            host: {{ include "nodejs-hello-world.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
